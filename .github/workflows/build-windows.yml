name: Compilar para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libwebp

      - name: Corregir rutas y configurar
        run: |
          echo "=== Corrigiendo ruta de mpv ==="
          MPV_PREFIX="$(cygpath -m /ucrt64)"
          sed -i "s|^prefix=/ucrt64$|prefix=${MPV_PREFIX}|" /ucrt64/lib/pkgconfig/mpv.pc

          echo "=== Prefijo corregido ==="
          grep "^prefix=" /ucrt64/lib/pkgconfig/mpv.pc

          echo "=== Rutas de mpv ==="
          pkg-config --cflags mpv
          pkg-config --libs mpv

          echo "=== Configurando CMake ==="
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DXUPER_FETCH_MBEDTLS=ON

      - name: Compilar
        run: cmake --build build-win

      - name: Pruebas
        run: ctest --test-dir build-win --output-on-failure

      - name: Empaquetar
        run: bash packaging/windows/package.sh build-win dist/Xuper-TV-Windows

      - uses: actions/upload-artifact@v4
        with:
          name: Xuper-TV-0.14.1-Windows
          path: dist/Xuper-TV-Windows
          if-no-files-found: error
