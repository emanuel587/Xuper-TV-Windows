name: Compilar para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-webview
            mingw-w64-ucrt-x86_64-webview2-loader

      - name: Validar interfaz WebView2
        shell: pwsh
        run: |
          node --version
          node --check web-ui/app.js
          if (!(Test-Path -Path 'web-ui/index.html' -PathType Leaf) -or (Get-Item 'web-ui/index.html').Length -eq 0) {
            throw 'web-ui/index.html no existe o está vacío.'
          }
          if (!(Test-Path -Path 'web-ui/styles.css' -PathType Leaf) -or (Get-Item 'web-ui/styles.css').Length -eq 0) {
            throw 'web-ui/styles.css no existe o está vacío.'
          }

      - name: Corregir rutas y configurar
        run: |
          echo "=== Convertir rutas de MSYS2 ==="
          WIN_PREFIX="$(cygpath -m /ucrt64)"

          find /ucrt64/lib/pkgconfig \
            -type f -name '*.pc' \
            -exec sed -i "s|/ucrt64|${WIN_PREFIX}|g" {} +

          echo "=== Comprobar rutas de mpv ==="
          pkg-config --cflags mpv
          pkg-config --libs mpv

          if pkg-config --cflags mpv | grep -qE '(^|[[:space:]])-I/ucrt64'; then
            echo "ERROR: todavía existen rutas MSYS2 sin convertir."
            exit 1
          fi

          echo "=== Configurar CMake ==="
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DXUPER_FETCH_MBEDTLS=ON

      - name: Compilar
        run: cmake --build build-win

      - name: Pruebas
        run: ctest --test-dir build-win --output-on-failure

      - name: Empaquetar
        run: |
          bash packaging/windows/package.sh build-win dist/Xuper-TV-Windows
          test -f dist/Xuper-TV-Windows/service.template.json
          test ! -e dist/Xuper-TV-Windows/service.json

      - uses: actions/upload-artifact@v4
        with:
          name: Xuper-TV-0.14.1-Windows
          path: dist/Xuper-TV-Windows
          if-no-files-found: error
